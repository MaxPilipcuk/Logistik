server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js|svg|png|jpg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
